<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interia - Interior Design</title>
    <link rel="stylesheet" href="./src/styles/main.css" />
  </head>
  <body>
    <header class="header">
      <div class="container">
        <div class="header__inner">
          <a class="logo header__logo" href="/">interia</a>
          <div class="header__actions">
            <nav class="nav header__nav">
              <ul class="nav__list">
                <li class="nav__item">
                  <a class="nav__link" href="#">home</a>
                </li>
                <li class="nav__item">
                  <a class="nav__link" href="#">pages</a>
                </li>
                <li class="nav__item">
                  <a class="nav__link" href="#">services</a>
                </li>
                <li class="nav__item">
                  <a class="nav__link" href="#">team</a>
                </li>
                <li class="nav__item">
                  <a class="nav__link" href="#">blog</a>
                </li>
              </ul>
            </nav>
            <button class="button button--main header__button" type="button">
              get started
            </button>
          </div>
        </div>
      </div>
    </header>
    <main>
      <section class="section hero">
        <div class="section__visual">
          <img
            class="hero__img"
            src="#"
            alt="Modern interior design with a grey armchair"
          />
        </div>

        <div class="container">
          <div class="hero__inner">
            <a class="swipe-link hero__swipe" href="#about">swipe down</a>

            <div class="hero__content">
              <h1 class="title title--main">We design your room aesthetic</h1>
              <p class="hero__text">
                Lectus quam id leo in vitae turpis nisi porta lorem mollis.
              </p>

              <button
                class="button-play hero__play"
                type="button"
                aria-label="Play video"
              >
                <svg class="hero__button-icon">
                  <use href="#"></use>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </section>
      <section class="section partners">
        <div class="container">
          <h2 class="visually-hidden">Our partners</h2>
          <ul class="partners__list">
            <li class="partners__item">
              <a
                class="partners__link"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
              >
                <svg class="partners__icon">
                  <use href="#"></use>
                </svg>
                <span class="partners__name">Sparta .Inc</span>
              </a>
            </li>
            <li class="partners__item">
              <a
                class="partners__link"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
              >
                <svg class="partners__icon">
                  <use href="#"></use>
                </svg>
                <span class="partners__name">Allianzy</span>
              </a>
            </li>
            <li class="partners__item">
              <a
                class="partners__link"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
              >
                <svg class="partners__icon">
                  <use href="#"></use>
                </svg>
                <span class="partners__name">Reys Ceramics</span>
              </a>
            </li>
            <li class="partners__item">
              <a
                class="partners__link"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
              >
                <svg class="partners__icon">
                  <use href="#"></use>
                </svg>
                <span class="partners__name">Fuda Furniture</span>
              </a>
            </li>
          </ul>
        </div>
      </section>
    </main>
    <footer></footer>
  </body>
</html>
